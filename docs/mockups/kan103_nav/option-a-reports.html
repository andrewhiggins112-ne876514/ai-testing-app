<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Option A — Reports</title>
  <link rel="stylesheet" href="base-mockup.css" />
  <style>body { display: block; overflow: auto; padding: 24px; }</style>
</head>
<body>
  <div class="shell">
    <div class="option-letter" aria-hidden="true">A</div>
    <div class="view-caption">REPORTS</div>

    <span class="variant-badge">OPTION A — Reports overlay</span>
    <div class="back-hint">Esc / Back to home</div>
    <div class="scrim"></div>
    <div class="orb dimmed"></div>
    <div class="drawer-fab app">&#9638;</div>
    <div class="drawer-fab screen">&#9776;</div>
    <div class="area-overlay">
      <h2>Reports</h2>
      <p class="sub">Dedicated area surface — same full-bleed pattern</p>
      <div class="report-metric"><div class="n">12</div><div class="l">Tests run</div></div>
      <div class="report-metric"><div class="n">94%</div><div class="l">Pass rate</div></div>
      <div class="report-metric"><div class="n">3</div><div class="l">Stories covered</div></div>
      <p style="margin-top:20px;font-size:12px;color:rgba(232,244,255,0.55)">Sections: summary, stories, bugs, evidence</p>
    </div>
  </div>
</body>
</html>

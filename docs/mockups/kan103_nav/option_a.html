<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Option A — full-bleed overlay</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #02060c; color: #d7f6ff; font: 14px/1.4 Segoe UI, sans-serif; }
  h1 { font-weight: 500; letter-spacing: 0.08em; font-size: 14px; color: #7ee8ff; margin: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 16px 24px; }
  figure { margin: 0; }
  img { width: 100%; border: 1px solid #16485c; border-radius: 12px; background: #000; }
  figcaption { color: #7ee8ff; margin: 8px 0; letter-spacing: 0.12em; font-size: 11px; }
  .frame { position: relative; height: 420px; background: #000; border: 1px solid #1a6d88; border-radius: 16px; overflow: hidden; }
  .orb { position: absolute; left: 50%; top: 38%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff, #5dfff2 28%, #00c2e8 62%, transparent 70%);
    box-shadow: 0 0 40px #00d4ff; }
  .chat { position: absolute; left: 12%; right: 12%; bottom: 28px; height: 36px; border: 1px solid #1a6d88; border-radius: 18px; }
  .drawer { position: absolute; top: 24px; right: 16px; width: 150px; bottom: 90px; border: 1px solid #1a6d88; border-radius: 12px; padding: 12px; font-size: 12px; }
  .drawer b { color: #7ee8ff; font-weight: 600; letter-spacing: 0.14em; font-size: 11px; }
  .nav { position: absolute; top: 24px; left: 16px; bottom: 70px; width: 120px; border: 1px solid #1a6d88; border-radius: 12px; padding: 12px; }
  .nav .on { color: #041018; background: #3ad7ff; border-radius: 6px; padding: 2px 6px; }
  .glass { position: absolute; inset: 18px 18px 64px 150px; border: 1px solid #1a6d88; border-radius: 14px; background: rgba(0,12,20,0.72); padding: 16px; }
  .dim { opacity: 0.35; filter: blur(1px); }
</style>
</head>
<body>
<h1>OPTION A — full-bleed overlay · App drawer is nav only · Screen drawer toggles HUD widgets</h1>
<div class="row">
  <figure>
    <figcaption>HOME</figcaption>
    <img src="option_a_home.png" alt="Option A home" />
    <div class="frame" style="margin-top:12px">
      <div class="orb"></div>
      <div class="drawer"><b>WIDGETS</b><p>Chat ON<br>Orb ON<br>Security status OFF<br>Reports mini OFF</p></div>
      <div class="chat"></div>
    </div>
  </figure>
  <figure>
    <figcaption>APP SETTINGS</figcaption>
    <img src="option_a_settings.png" alt="Option A settings" />
    <div class="frame" style="margin-top:12px">
      <div class="orb dim"></div>
      <div class="nav"><b style="color:#7ee8ff">APP</b><p><span class="on">Settings</span><br>Security<br>Reports<br>Documents<br>Desktop<br>Suites<br>Sandboxes</p></div>
      <div class="glass"><b style="color:#fff">APP SETTINGS</b><p>Jira URL<br>Connectors<br>Credential status CONFIGURED<br>Security OFFICIAL</p><p>No orb sliders.</p></div>
      <div class="chat"></div>
    </div>
  </figure>
</div>
</body>
</html>

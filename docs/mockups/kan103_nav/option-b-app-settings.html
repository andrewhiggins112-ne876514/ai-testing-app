<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Option B — App Settings stage</title>
  <link rel="stylesheet" href="base-mockup.css" />
  <style>body { display: block; overflow: auto; padding: 24px; }</style>
</head>
<body>
  <div class="shell">
    <div class="option-letter" aria-hidden="true">B</div>
    <div class="view-caption">APP SETTINGS</div>

    <span class="variant-badge">OPTION B — App Settings stage (orb pip)</span>
    <div class="drawer-fab app">&#9638;</div>
    <div class="panel app-drawer">
      <div class="nav-item">Suites</div>
      <div class="nav-item active">Settings</div>
      <div class="nav-item">Security</div>
      <div class="nav-item">Reports</div>
    </div>
    <div class="drawer-fab screen">&#9776;</div>
    <div class="orb pip"></div>
    <div class="stage-fill">
      <h2>App Settings</h2>
      <p class="sub">Large stage; agent orb shrinks to corner pip</p>
      <div class="field">
        <label>Jira base URL</label>
        <div class="fake-input">https://your-site.atlassian.net</div>
      </div>
      <div class="field">
        <label>Credentials</label>
        <div class="fake-input">Configured (status only)</div>
      </div>
      <div class="btn-row">
        <span class="btn">Save</span>
        <span class="btn ghost">Home</span>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Option C — App Settings</title>
  <link rel="stylesheet" href="base-mockup.css" />
  <style>body { display: block; overflow: auto; padding: 24px; }</style>
</head>
<body>
  <div class="shell">
    <span class="variant-badge">OPTION C — App Settings (full-bleed after hub)</span>
    <div class="back-hint">Esc / Back to home</div>
    <div class="scrim"></div>
    <div class="orb dimmed"></div>
    <div class="drawer-fab app">&#9638;</div>
    <div class="panel app-drawer" style="opacity:0.55">
      <div class="nav-item">Suites</div>
      <div class="nav-item active">Settings</div>
      <div class="nav-item">Security</div>
    </div>
    <div class="drawer-fab screen">&#9776;</div>
    <div class="area-overlay">
      <h2>App Settings</h2>
      <p class="sub">Connectors and app-wide config — not orb visuals</p>
      <div class="field">
        <label>Jira base URL</label>
        <div class="fake-input">https://your-site.atlassian.net</div>
      </div>
      <div class="field">
        <label>Credentials</label>
        <div class="fake-input">Configured (status only)</div>
      </div>
      <div class="field">
        <label>Local settings store</label>
        <div class="fake-input">%LOCALAPPDATA%\ai_testing_app\</div>
      </div>
      <div class="btn-row">
        <span class="btn">Save</span>
        <span class="btn ghost">Back to agent home</span>
      </div>
    </div>
  </div>
</body>
</html>

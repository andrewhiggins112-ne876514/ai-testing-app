<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>G+tray look picker — pick a number</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 24px;
    background: #000;
    color: #e8f7ff;
    font: 14px/1.4 "Segoe UI", Bahnschrift, sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 20px; color: #50cdff; }
  p { margin: 0 0 20px; color: rgba(180, 220, 240, 0.55); max-width: 720px; }
  .grid { display: grid; gap: 28px; }
  figure {
    margin: 0;
    padding: 12px;
    border: 1px solid rgba(80, 205, 255, 0.28);
    background: #0c1014;
  }
  figcaption {
    margin: 0 0 10px;
    font: 600 13px/1.3 "Segoe UI", sans-serif;
    color: #50cdff;
  }
  figcaption span { color: rgba(180, 220, 240, 0.55); font-weight: 400; }
  img {
    display: block;
    width: 100%;
    max-width: 1100px;
    height: auto;
    border: 1px solid rgba(80, 205, 255, 0.18);
  }
</style>
</head>
<body>
<h1>G+tray — look variants (pick 1–6)</h1>
<p>Structure already Accepted. Reply in chat with a number. Hollow hole + right icon tray; Pause own icon; Assist/Mist on tray.</p>
<div class="grid">
  <figure>
    <figcaption>1 — Cyan hairline <span>· thin stroke, flat dark rail</span></figcaption>
    <img src="g-tray-look-1-cyan-hairline.jpg" alt="Look 1 Cyan hairline" />
  </figure>
  <figure>
    <figcaption>2 — Frosted glass <span>· soft blur tray, Game Bar materials</span></figcaption>
    <img src="g-tray-look-2-frosted-glass.jpg" alt="Look 2 Frosted glass" />
  </figure>
  <figure>
    <figcaption>3 — Inspect glow <span>· stronger cyan stroke + outer glow</span></figcaption>
    <img src="g-tray-look-3-inspect-glow.jpg" alt="Look 3 Inspect glow" />
  </figure>
  <figure>
    <figcaption>4 — Compact rail <span>· denser VS Code–tight chrome</span></figcaption>
    <img src="g-tray-look-4-compact-rail.jpg" alt="Look 4 Compact rail" />
  </figure>
  <figure>
    <figcaption>5 — Floating card <span>· elevated shell + inset wells</span></figcaption>
    <img src="g-tray-look-5-floating-card.jpg" alt="Look 5 Floating card" />
  </figure>
  <figure>
    <figcaption>6 — Recording pulse <span>· rec state, Pause highlighted</span></figcaption>
    <img src="g-tray-look-6-recording-pulse.jpg" alt="Look 6 Recording pulse" />
  </figure>
</div>
</body>
</html>

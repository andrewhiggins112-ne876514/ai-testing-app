<!DOCTYPE html>
<html lang="en" data-charter-float-page="1" data-charter-g-tray="1" data-look="4">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Charter Frame</title>
  <link rel="stylesheet" href="/ui/desktop/charter_float.css?v=desk155" />
</head>
<body class="charter-float-body charter-tray-bar" data-charter-float="1" data-os-float="1" data-snip-dock="1" data-placement="under_ring">
  <header class="charter-tray-bar-header" data-charter-float-drag="1" title="Drag to move ring + tray">
    <span class="charter-tray-bar-title">Charter</span>
    <span id="cf-chip" class="charter-tray-bar-chip" role="status">Session open</span>
  </header>
  <div class="charter-tray-bar-row" data-charter-float-dock="1" data-manual-loop-dock="1">
    <button type="button" id="cf-still" class="cf-icon" title="Still" data-charter-still="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8.5h3l1.4-2h7.2l1.4 2H20v10H4V8.5z"/><circle cx="12" cy="13" r="3.2"/></svg>
    </button>
    <button type="button" id="cf-note" class="cf-icon" title="Note" data-charter-note="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 4.5h8.5L19 8v11.5H7V4.5z"/><path d="M15 4.5V8h3.5"/><path d="M9.5 12h5M9.5 15.5h5"/></svg>
    </button>
    <button type="button" id="cf-pause" class="cf-icon" title="Pause" data-charter-pause="1" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="6" width="3.2" height="12" rx="0.6"/><rect x="13.8" y="6" width="3.2" height="12" rx="0.6"/></svg>
    </button>
    <button type="button" id="cf-assist" class="cf-icon" title="Assist" data-charter-assist="1" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4.5 13.2 9H18l-3.6 2.8L15.6 17 12 14.4 8.4 17l1.2-5.2L6 9h4.8L12 4.5z"/></svg>
    </button>
    <button type="button" id="cf-mist" class="cf-icon" title="Mist" data-charter-mist="1" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 15.5h9.5a3.5 3.5 0 0 0 .2-7 5 5 0 0 0-9.5 1.2A3.2 3.2 0 0 0 7 15.5z"/></svg>
    </button>
    <span class="cf-sep" aria-hidden="true"></span>
    <button type="button" id="cf-end" class="cf-icon" title="End" data-charter-end="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="6.5" y="6.5" width="11" height="11" rx="1.2"/></svg>
    </button>
    <button type="button" id="cf-cancel" class="cf-icon" title="Cancel" data-charter-cancel="1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.2"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
    </button>
  </div>
  <div id="cf-note-sheet" class="charter-note-sheet" hidden data-charter-note-sheet="1">
    <input id="cf-note-input" type="text" maxlength="500" placeholder="Note…" autocomplete="off" data-charter-note-input="1" />
    <button type="button" id="cf-note-add" class="cf-note-go" title="Add note">Add</button>
  </div>
  <div id="cf-cancel-confirm" class="charter-float-cancel" hidden data-charter-cancel-confirm="1">
    <span>Discard this session?</span>
    <button type="button" id="cf-cancel-yes" class="cf-note-go" data-charter-cancel-yes="1">Yes</button>
    <button type="button" id="cf-cancel-no" class="cf-note-go secondary" data-charter-cancel-no="1">Keep</button>
  </div>
  <!-- Keep ids/markers for JS/tests (collapsed toggle unused in under-ring mode). -->
  <button type="button" id="cf-tray-toggle" hidden aria-hidden="true" data-charter-tray-toggle="1"></button>
  <button type="button" id="cf-tray-toggle-edge" hidden aria-hidden="true" data-charter-tray-toggle="1"></button>
  <script src="/ui/desktop/charter_float.js?v=desk155"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Testing Agent</title>
  <link rel="stylesheet" href="/ui/desktop/desktop.css?v=desk9b" />
</head>
<body>
  <div id="app">
    <div id="orb-config" hidden
      data-style="mystic"
      data-calm-color="#50cdff"
      data-thinking-color="#b388ff"
      data-size="360"
      data-shape="sphere"
      data-spin-speed="1"
      data-turbulence="1"
      data-pulse="1"
      data-glow="1"></div>

    <div id="energy-orb-host" class="orb-host orb-fill" aria-hidden="true">
      <div class="energy-orb" data-state="calm">
        <canvas width="680" height="800" aria-label="energy orb"></canvas>
        <div class="orb-state">CALM</div>
      </div>
    </div>

    <p class="app-title">AI Testing Agent</p>

    <section id="chat-panel" class="shell-surface chat-panel movable-widget" data-widget="chat-panel" aria-label="Chat" title="Drag to move">
      <div id="chat-log" class="chat-log"></div>
    </section>

    <form id="chat-form" class="shell-surface chat-bar" autocomplete="off">
      <input id="chat-input" type="text" placeholder="Talk to the agent…" aria-label="Message" />
      <button type="submit" class="send-btn" aria-label="Send">↑</button>
    </form>

    <button id="app-drawer-toggle" class="icon-btn drawer-toggle app-drawer-toggle" type="button"
      data-edge-snap="1" data-default-edge="left"
      aria-label="Open app menu" aria-expanded="false" aria-controls="app-drawer" title="App (drag to edge)">▦</button>
    <aside id="app-drawer" class="side-drawer app-drawer edge-left" aria-hidden="true">
      <div class="drawer-inner shell-surface">
        <h2 class="panel-title">App</h2>
        <nav class="app-nav" aria-label="Application sections">
          <button type="button" class="app-nav-item" data-section="settings" disabled title="Coming soon">Settings</button>
          <button type="button" class="app-nav-item" data-section="reports" disabled title="Coming soon">Reports</button>
        </nav>
        <p class="drawer-hint">More sections will appear here.</p>
      </div>
    </aside>

    <button id="screen-drawer-toggle" class="icon-btn drawer-toggle screen-drawer-toggle" type="button"
      data-edge-snap="1" data-default-edge="right"
      aria-label="Open screen panel" aria-expanded="false" aria-controls="screen-drawer" title="Screen (drag to edge)">☰</button>
    <aside id="screen-drawer" class="side-drawer screen-drawer edge-right" aria-hidden="true">
      <div class="drawer-inner shell-surface">
        <div class="icon-rail" role="toolbar" aria-label="Screen widgets">
          <button type="button" class="icon-btn active" data-action="toggle-chat" title="Chat panel">💬</button>
          <button type="button" class="icon-btn" data-action="toggle-orb" title="Orb controls">⚙</button>
          <button type="button" class="icon-btn" data-action="toggle-widget-settings" title="Widget settings">▣</button>
        </div>
        <div id="orb-controls" class="orb-controls" hidden>
          <h2 class="panel-title">Orb</h2>
          <label>Style
            <select id="ctrl-style">
              <option value="mystic">mystic</option>
              <option value="aether">aether</option>
              <option value="neural">neural</option>
            </select>
          </label>
          <label>Calm <input id="ctrl-calm" type="color" value="#50cdff" /></label>
          <label>Thinking <input id="ctrl-thinking" type="color" value="#b388ff" /></label>
          <label>Size <input id="ctrl-size" type="range" min="200" max="480" step="20" value="360" /></label>
          <label>Spin <input id="ctrl-spin" type="range" min="0" max="2" step="0.1" value="1" /></label>
          <label>Turbulence <input id="ctrl-turbulence" type="range" min="0" max="2" step="0.1" value="1" /></label>
          <label>Pulse <input id="ctrl-pulse" type="range" min="0" max="2" step="0.1" value="1" /></label>
          <label>Glow <input id="ctrl-glow" type="range" min="0" max="2" step="0.1" value="1" /></label>
          <button type="button" id="ctrl-save" class="save-btn">Save</button>
        </div>
        <div id="widget-settings" class="widget-controls" hidden>
          <h2 class="panel-title">Widget Settings</h2>
          <label>Transparency
            <input id="ctrl-widget-transparency" type="range" min="0" max="95" step="5" value="90" />
          </label>
          <label>Border <input id="ctrl-widget-border" type="color" value="#50cdff" /></label>
          <label>Background <input id="ctrl-widget-bg" type="color" value="#000000" /></label>
        </div>
      </div>
    </aside>
  </div>

  <script src="/ui/vendor/three.min.js"></script>
  <script src="/ui/orb_webgl.js?v=neural12"></script>
  <script src="/ui/desktop/desktop.js?v=desk9b"></script>
</body>
</html>
